name: Tjek venteliste-status

on:
  schedule:
    - cron: '*/10 * * * *'   # hver 10. minut (GitHub kan forsinke lidt under høj belastning)
  workflow_dispatch:          # gør det muligt at køre manuelt fra GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer afhængigheder
        run: pip install requests

      - name: Kør tjek
        run: python monitor.py

      - name: Tjek om notifikation skal sendes
        id: check_notification
        run: |
          if [ -s notification.txt ]; then
            echo "send=true" >> $GITHUB_OUTPUT
          else
            echo "send=false" >> $GITHUB_OUTPUT
          fi

      - name: Læs notifikationsindhold
        id: notif
        if: steps.check_notification.outputs.send == 'true'
        run: |
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat notification.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email via Gmail
        if: steps.check_notification.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Waitly venteliste opdatering"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: ${{ secrets.GMAIL_ADDRESS }}
          body: ${{ steps.notif.outputs.content }}

      - name: Gem opdateret status i repoet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Opdater status [skip ci]"
          git push
