name: Check waitlist status

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay slightly under high load)
  workflow_dispatch:          # allows manual trigger from the GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run check
        run: python monitor.py

      - name: Check whether notification should be sent
        id: check_notification
        run: |
          if [ -s notification.txt ]; then
            echo "send=true" >> $GITHUB_OUTPUT
          else
            echo "send=false" >> $GITHUB_OUTPUT
          fi

      - name: Send email via Gmail
        if: steps.check_notification.outputs.send == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import smtplib, os
          from email.mime.text import MIMEText

          addr = os.environ['GMAIL_ADDRESS'].strip()
          pw = os.environ['GMAIL_APP_PASSWORD'].replace('\xa0', '').replace(' ', '')

          with open('notification.txt') as f:
              body = f.read()

          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = 'Waitly waitlist update'
          msg['From'] = addr
          msg['To'] = addr

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as smtp:
              smtp.login(addr, pw)
              smtp.sendmail(addr, addr, msg.as_string())

          print('Email sent.')
          PYEOF

      - name: Commit updated status to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update status [skip ci]"
          git push
